services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askmehire
      POSTGRES_PASSWORD: askmehire
      POSTGRES_DB: askmehire
    ports:
      - "5432:5432"
    volumes:
      - askmehire_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmehire -d askmehire"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://askmehire:askmehire@postgres:5432/askmehire?schema=public
      REDIS_URL: redis://redis:6379
      DEFAULT_TENANT_ID: abb9786c-8959-516a-9750-05d508607b84
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]

volumes:
  askmehire_pg:
